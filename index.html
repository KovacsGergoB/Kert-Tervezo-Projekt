<!DOCTYPE html>
<html lang="hu" ng-app="KertApp">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <title>Kert tervező</title>
</head>

<body ng-controller="kert as vm">
    <div class="container">
        <h1 class="text-center pt-2 pb-3">Kert tervező</h1>

        <!-- Hozzáadás a listához -->
        <form ng-submit="vm.add()">
            <div class="row g-3 align-items-center pb-5">
                <div class="col-2">
                    <select class="form-select wideinput" ng-model="vm.season"
                        ng-options="c as c.name for c in vm.seasons"></select>
                </div>
                <div class="col-2">
                    <div class="row pb-2">
                        <div class="col">
                            <input id="nev" class="form-control" ng-model="vm.newName" placeholder="Név" required>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col">
                            <input id="latnev" class="form-control" ng-model="vm.newLatName" placeholder="Latin Név">
                        </div>
                    </div>
                </div>
                <div class="col-3">
                    <input id="descr" class="form-control wideinput" ng-model="vm.newDescr" placeholder="Leírás">
                </div>
                <div class="col-3">
                    <input type="number" id="terulet" class="form-control wideinput" ng-model="vm.newArea"
                        placeholder="Terület (négyzet centiméter)" required>
                </div>
                <div class="col-1">
                    <button id="add" class="btn btn-secondary">Hozzáad</button>
                </div>
            </div>
        </form>

        <!-- Hozzáadás előnézete -->
        <h2 class="m-auto">Előnézet:</h2>
        <div class="row border border-secondary rounded py-3 " ng-style="{'background': vm.season.bgcol}">
            <div class="col-2">
                <img class="season-icon" src="images/{{vm.season.icon}}">
            </div>
            <div class="col-2">
                <div class="row">
                    <div class="col">
                        <span>{{vm.newName || '---'}}</span>
                    </div>
                </div>
                <div class="row">
                    <div class="col">
                        <small class="text-secondary">{{vm.newLatName || '---'}}</small>
                    </div>
                </div>
            </div>
            <div class="col-3">
                <span>{{vm.newDescr || '---'}}</span>
            </div>
            <div class="col-2">
                <span>{{vm.newArea || '---'}} cm<sup>2</sup></span>

            </div>
        </div>
        
        <!-- Keresések -->
        <div class="row pt-5 pb-3 mx-auto justify-content-center">
            <div class="col-3 px-2"><input class="form-control" ng-model="vm.nameSearch" placeholder="Névben Keresés">
            </div>
            <div class="col-3 px-2"><input class="form-control" ng-model="vm.latSearch"
                    placeholder="Latin névben Keresés"></div>
            <div class="col-3 px-2"><input class="form-control" ng-model="vm.descrSearch"
                    placeholder="Leírásban Keresés"></div>
        </div>

        <!-- Lista -->
        <div class="card shadow-sm g-2">
            <ul class="list-group list-group-flush">
                <li class="list-group-item d-flex align-items-center"
                    ng-repeat="i in vm.coll | filter:vm.nszuro | filter:vm.lszuro | filter:vm.dszuro"
                    ng-style="{'background': i.seas.bgcol}">
                    <input type="hidden" name="hid" value="{{i.id}}">
                    <div class="col-2">
                        <img class="season-icon" src="images/{{i.seas.icon}}">
                    </div>
                    <div class="col-2">
                        <div class="row">
                            <div class="col">
                                <span>{{i.name}}</span>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col">
                                <small class="text-secondary">{{i.latname}}</small>
                            </div>
                        </div>
                    </div>
                    <div class="col-4">
                        <span>{{i.descr}}</span>                        
                    </div>
                    <div class="col-3">
                        <span>{{i.area}} cm<sup>2</sup></span>
                    </div>
                    <div class="col-1">
                        <button type="button" class="btn btn-danger" ng-click="vm.delete($index)" onclick="torles(this.name)" id="deleteBtn"  
                            name="{{i.id}}">Törlés</button>
                    </div>
        </div>
        </li>
        <li class="list-group-item text-muted"
            ng-if="(vm.coll | filter:vm.nszuro | filter:vm.lszuro | filter:vm.dszuro).length===0">
            <div class="col-2 p-3">
                <span>Nincs találat</span>
            </div>
        </li>
        <li class="list-group-item text-end pe-5 shadow-sm my-2">
            <div id="totArea">

            </div>

        </li>
        </ul>
    </div>
    </div>


    <script>
        angular.module('KertApp', [])
            .controller('kert', function () {
                var vm = this;

                vm.seasons = [
                    { name: 'Tavaszi', icon: 'spr.png', bgcol: '#5df542' },
                    { name: 'Nyári', icon: 'summ.png', bgcol: '#f0e143' },
                    { name: 'Őszi', icon: 'fall.png', bgcol: '#e89323' },
                    { name: 'Téli', icon: 'wint.png', bgcol: '#50c1de' }
                ];
                vm.season = vm.seasons[0];

                vm.coll = [
                    { id: 0, seas: vm.seasons[0], name: 'Zsálya', latname: 'Salvia Nemorosa', descr: 'Közepes termetű. Laza, szegényebb talajt szeret', area: 15 },
                    { id: 1, seas: vm.seasons[2], name: 'Árnyékliliom', latname: 'Hosta', descr: 'Alacsony termetű. Minden talajon jól fejlődik.', area: 20 }
                ];
                vm.newName = ''; vm.newLatName = ''; vm.newDescr = ''; vm.newArea = '';
                vm.newId = 2;


                vm.add = function () {
                    if (!vm.newName || !vm.newArea) return;
                    vm.coll.push({ id: vm.newId, seas: vm.season, name: vm.newName, latname: vm.newLatName, descr: vm.newDescr, area: vm.newArea });
                    vm.newName = ''; vm.newLatName = ''; vm.newDescr = ''; vm.newArea = '';
                    vm.newId++;
                }

                vm.nszuro = function (item) {
                    if (!vm.nameSearch) return true;
                    return item.name.toLowerCase().includes(vm.nameSearch.toLowerCase());
                }

                vm.lszuro = function (item) {
                    if (!vm.latSearch) return true;
                    return item.latname.toLowerCase().includes(vm.latSearch.toLowerCase());
                }

                vm.dszuro = function (item) {
                    if (!vm.descrSearch) return true;
                    return item.descr.toLowerCase().includes(vm.descrSearch.toLowerCase());
                }

                vm.delete = function (i) { vm.coll.splice(i, 1) };                
            });
    </script>
    <script src="kertts.js"></script>
</body>
</html>
